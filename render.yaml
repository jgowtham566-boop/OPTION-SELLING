services:
  - type: web
    name: option-selling
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPTOPSY_MODEL
        value: gemini/gemini-3.8-flash
      - key: EODHD_API_KEY
        sync: false
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_ACCESS_TOKEN
        sync: false
